[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leg-allocation-sim"
version = "0.1.0"
description = "Open-source engine for Swiss local electricity communities (LEG) and self-consumption groups: allocation, tariffs, bills, meter-data export."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pandas>=2.1", "numpy>=1.26", "pydantic>=2.5", "typer>=0.12", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
leg-sim = "leg_sim.cli:app"

[tool.setuptools]
packages = ["leg_sim"]

[tool.setuptools.package-data]
leg_sim = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:asyncio"

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # typer.Option defaults
